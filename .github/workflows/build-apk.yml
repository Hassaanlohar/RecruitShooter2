
name: Build Recruit Shooter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and build APK
        run: |
          unzip RecruitShooter_Android_Project.zip
          cd RecruitShooter-Android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecruitShooter-apk
          path: RecruitShooter-Android/app/build/outputs/apk/debug/app-debug.apk
          
